<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Meal Planner</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showMealPlans()">Meal Plans</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div id="mealList" class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Meals</h5>
                    </div>
                    <div class="card-body">
                        <div id="mealFilters" class="mb-3">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <select id="cuisineFilter" class="form-select">
                                        <option value="">All Cuisines</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select id="difficultyFilter" class="form-select">
                                        <option value="">All Difficulties</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select id="dietaryFilter" class="form-select">
                                        <option value="">All Dietary Info</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-12 mt-3">
                                <button id="clearFilters" class="btn btn-outline-secondary w-100">
                                    Clear Filters
                                </button>
                            </div>
                        </div>
                        <div id="mealsContainer" class="list-group">
                            <!-- Meals will be added here -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div id="mealDetails" class="card d-none">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Meal Details</h5>
                    </div>
                    <div class="card-body">
                        <h4 id="mealName"></h4>
                        <p id="mealDescription"></p>
                        <h6>Ingredients:</h6>
                        <ul id="mealIngredients"></ul>
                        <h6>Instructions:</h6>
                        <ol id="mealInstructions"></ol>
                        <div class="mt-3">
                            <button class="btn btn-primary" onclick="addMealToPlan()">Add to Meal Plan</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="mealPlansContainer" class="mt-4 d-none">
            <div class="card">
                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">Meal Plans</h5>
                        <button class="btn btn-primary" onclick="createNewPlan()">Create New Plan</button>
                    </div>
                </div>
                <div class="card-body">
                    <div id="mealPlansList" class="list-group">
                        <!-- Meal plans will be added here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
